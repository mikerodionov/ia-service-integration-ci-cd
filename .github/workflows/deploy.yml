name: Deploy AI Architecture

on:
  workflow_dispatch: # Manual trigger only via GitHub UI

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  GAR_REPO: ai-proxy-repo
  IMAGE_NAME: jira-auth-proxy

jobs:
  plan:
    name: "Terraform Plan & Container Build"
    runs-on: ubuntu-latest
    env:
      OIDC_PROVIDER: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
      OIDC_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    outputs:
      proxy_image: ${{ steps.build-image.outputs.image_uri }}
      
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (OIDC)
      if: env.OIDC_PROVIDER != '' && env.OIDC_SERVICE_ACCOUNT != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.OIDC_PROVIDER }}
        service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

    - name: Authenticate to Google Cloud (Service Account Key Fallback)
      if: env.OIDC_PROVIDER == '' || env.OIDC_SERVICE_ACCOUNT == ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker $REGION-docker.pkg.dev

    - name: Build and Push Proxy Image
      id: build-image
      run: |
        IMAGE_URI="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPO/$IMAGE_NAME:${{ github.sha }}"
        docker build -t $IMAGE_URI ./app/proxy
        docker push $IMAGE_URI
        echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

    - name: Terraform Lint & Validate
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_proxy_image: ${{ steps.build-image.outputs.image_uri }}
        TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
      run: |
        terraform fmt -check
        terraform validate

    - name: Terraform Plan
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_proxy_image: ${{ steps.build-image.outputs.image_uri }}
        TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
      run: terraform plan -out=tfplan

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ./terraform/tfplan
        retention-days: 1

  apply:
    name: "Terraform Apply"
    needs: plan
    environment: production # Triggers the manual approval gate in GitHub
    runs-on: ubuntu-latest
    env:
      OIDC_PROVIDER: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
      OIDC_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (OIDC)
      if: env.OIDC_PROVIDER != '' && env.OIDC_SERVICE_ACCOUNT != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.OIDC_PROVIDER }}
        service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

    - name: Authenticate to Google Cloud (Service Account Key Fallback)
      if: env.OIDC_PROVIDER == '' || env.OIDC_SERVICE_ACCOUNT == ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: ./terraform

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

    - name: Terraform Apply
      working-directory: ./terraform
      run: terraform apply -auto-approve tfplan