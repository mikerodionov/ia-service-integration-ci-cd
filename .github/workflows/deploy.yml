name: Deploy AI Architecture

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: europe-west1
      GAR_REPO: ai-proxy-repo
      IMAGE_NAME: jira-auth-proxy

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker $REGION-docker.pkg.dev

    - name: Build and Push Proxy Image
      run: |
        IMAGE_URI="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$GAR_REPO/$IMAGE_NAME:${{ github.sha }}"
        docker build -t $IMAGE_URI ./app/proxy
        docker push $IMAGE_URI
        # Export for Terraform to use
        echo "PROXY_IMAGE=$IMAGE_URI" >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

    - name: Terraform Plan
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_proxy_image: ${{ steps.build-image.outputs.image_uri }}
        TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
      run: terraform plan -out=tfplan

    - name: Terraform Apply
          working-directory: ./terraform
          env:
            TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
            TF_VAR_proxy_image: ${{ needs.plan.outputs.proxy_image }}
            TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
          run: terraform apply -auto-approve tfplan