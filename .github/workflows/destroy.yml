name: Destroy AI Architecture

on:
  workflow_dispatch: # Manual trigger only via GitHub UI

permissions:
  contents: read
  id-token: write

jobs:
  plan-destroy:
    name: "Terraform Destroy Plan"
    runs-on: ubuntu-latest
    env:
      OIDC_PROVIDER: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
      OIDC_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (OIDC)
      if: env.OIDC_PROVIDER != '' && env.OIDC_SERVICE_ACCOUNT != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.OIDC_PROVIDER }}
        service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

    - name: Authenticate to Google Cloud (Service Account Key Fallback)
      if: env.OIDC_PROVIDER == '' || env.OIDC_SERVICE_ACCOUNT == ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

    - name: Terraform Plan Destroy
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_proxy_image: "dummy-value-for-destroy"
        TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
      run: terraform plan -destroy -out=tfdestroyplan

    - name: Upload Destroy Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfdestroyplan
        path: ./terraform/tfdestroyplan
        retention-days: 1

  destroy:
    name: "Terraform Destroy Apply"
    needs: plan-destroy
    environment: production # Triggers the manual approval gate in GitHub
    runs-on: ubuntu-latest
    env:
      OIDC_PROVIDER: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
      OIDC_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (OIDC)
      if: env.OIDC_PROVIDER != '' && env.OIDC_SERVICE_ACCOUNT != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.OIDC_PROVIDER }}
        service_account: ${{ env.OIDC_SERVICE_ACCOUNT }}

    - name: Authenticate to Google Cloud (Service Account Key Fallback)
      if: env.OIDC_PROVIDER == '' || env.OIDC_SERVICE_ACCOUNT == ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Download Destroy Plan
      uses: actions/download-artifact@v4
      with:
        name: tfdestroyplan
        path: ./terraform

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

    - name: Terraform Destroy Apply
      working-directory: ./terraform
      env:
        TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        TF_VAR_proxy_image: "dummy-value-for-destroy"
        TF_VAR_jira_webhook_secret: ${{ secrets.TF_VAR_jira_webhook_secret }}
      run: terraform apply -auto-approve tfdestroyplan